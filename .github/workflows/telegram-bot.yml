name: 🤖 Ania Bot (GitHub Native)

on:
  schedule:
    # Se ejecuta cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  check-and-reply:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🧠 Ejecutar Lógica del Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          pip install requests
          python - << 'EOF'
          import json, requests, os

          token = os.getenv('TELEGRAM_TOKEN')
          state_file = 'bot_state.json'

          # 1. Leer el último mensaje procesado
          try:
              with open(state_file, 'r') as f:
                  state = json.load(f)
          except:
              state = {"offset": 0}
          
          offset = state.get("offset", 0)

          # 2. Pedir mensajes nuevos a Telegram
          url = f"https://api.telegram.org/bot{token}/getUpdates?offset={offset}&timeout=1"
          res = requests.get(url).json()

          if res.get('ok') and res.get('result'):
              updates = res['result']
              
              for update in updates:
                  msg = update.get('message')
                  if msg and msg.get('text'):
                      chat_id = msg['chat']['id']
                      text = msg['text'].strip().lower()
                      reply = ""

                      # 🧠 LÓGICA DE RESPUESTAS
                      if text in ["/start", "hola", "buenas", "hi"]:
                          reply = "¡Hola! 👋 Soy *Ania*, tu asistente de MediTech.\n\nUsa /help para ver qué puedo hacer."
                      elif text == "/help":
                          reply = "📋 *Comandos:*\n/start - Saludo\n/help - Ayuda\n/web - Ir a la tienda\n/productos - Ver catálogo"
                      elif text == "/web" or "tienda" in text:
                          reply = "🌐 Visita nuestra tienda aquí:\nhttps://calm291094-del.github.io/"
                      elif text == "/productos":
                          reply = "🛍️ *Catálogo ANIA OS:*\n\n1️⃣ Kit Neural v13\n2️⃣ Módulo de Clima\n3️⃣ Agente Autónomo\n\nEscribe /web para ver más."
                      else:
                          reply = "🤖 No entiendo ese comando. Escribe /help para ver las opciones."

                      # Enviar respuesta
                      requests.post(f"https://api.telegram.org/bot{token}/sendMessage", json={
                          "chat_id": chat_id,
                          "text": reply,
                          "parse_mode": "Markdown"
                      })
                  
                  # Actualizar el offset para no leer este mensaje de nuevo
                  offset = update['update_id'] + 1

              # 3. Guardar el nuevo estado
              with open(state_file, 'w') as f:
                  json.dump({"offset": offset}, f)
              
              # 4. Guardar los cambios en GitHub para la próxima vez
              os.system("git config user.name 'GitHub Actions Bot'")
              os.system("git config user.email 'actions@github.com'")
              os.system("git add bot_state.json")
              os.system("git commit -m '🤖 Actualizar estado del bot' || exit 0")
              os.system("git push")
              print("✅ Mensajes procesados y estado guardado.")
          else:
              print("⏳ No hay mensajes nuevos.")
          EOF

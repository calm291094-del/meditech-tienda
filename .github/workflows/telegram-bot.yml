name: 🤖 Ania Bot (Simple Test)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-and-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 📥 Descargar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🧠 Ejecutar Bot (Sin IA Externa)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          pip install requests
          python - << 'EOF'
          import json, requests, os

          token = os.getenv('TELEGRAM_TOKEN')
          state_file = 'bot_state.json'

          print("🚀 Iniciando bot simple...")

          # 1. Eliminar webhook
          try:
              del_webhook = requests.get(f"https://api.telegram.org/bot{token}/deleteWebhook?drop_pending_updates=true", timeout=5).json()
              print(f"✅ Webhook eliminado: {del_webhook.get('ok', False)}")
          except Exception as e:
              print(f"⚠️ Error eliminando webhook: {e}")

          # 2. Leer estado
          try:
              with open(state_file, 'r') as f:
                  state = json.load(f)
          except:
              state = {"offset": 0}
          
          offset = state.get("offset", 0)
          print(f"📖 Offset actual: {offset}")

          # 3. Obtener mensajes
          try:
              res = requests.get(f"https://api.telegram.org/bot{token}/getUpdates?offset={offset}&timeout=1", timeout=5).json()
              print(f"✅ getUpdates: {res.get('ok', False)}")
          except Exception as e:
              print(f"❌ Error: {e}")
              res = {"ok": False, "result": []}

          if res.get('ok') and res.get('result'):
              updates = res['result']
              print(f"✅ {len(updates)} mensajes encontrados!")
              
              for update in updates:
                  msg = update.get('message')
                  if msg and msg.get('text'):
                      chat_id = msg['chat']['id']
                      text = msg['text'].strip().lower()
                      reply = ""

                      if text in ["/start", "hola", "buenas", "hi"]:
                          reply = "¡Hola! 👋 Soy *Ania*, tu asistente de MediTech.\n\nUsa /help para ver comandos."
                      elif text == "/help":
                          reply = "📋 *Comandos:*\n/start - Saludo\n/help - Ayuda\n/web - Tienda\n/productos - Catálogo"
                      elif text == "/web" or "tienda" in text:
                          reply = "🌐 Tienda oficial:\nhttps://calm291094-del.github.io/"
                      elif text == "/productos":
                          reply = "🛍️ *Catálogo ANIA OS:*\n\n1️⃣ Kit Neural v13\n2️⃣ Módulo Clima Holguín\n3️⃣ Agente Autónomo\n\n/web para más info."
                      else:
                          reply = "🤖 No entiendo ese comando. Escribe /help para ver opciones."

                      try:
                          send_res = requests.post(f"https://api.telegram.org/bot{token}/sendMessage", json={
                              "chat_id": chat_id,
                              "text": reply,
                              "parse_mode": "Markdown"
                          }, timeout=5).json()
                          print(f"✅ Enviado a {chat_id}: {send_res.get('ok', False)}")
                      except Exception as e:
                          print(f"❌ Error enviando: {e}")
                  
                  offset = update['update_id'] + 1

              with open(state_file, 'w') as f:
                  json.dump({"offset": offset}, f)
              
              os.system("git config user.name 'Ania Bot'")
              os.system("git config user.email 'ania@meditech.local'")
              os.system("git add bot_state.json")
              os.system("git commit -m '🤖 Actualizar estado' || exit 0")
              os.system("git push")
              print("✅ ¡Completado!")
          else:
              print("⏳ No hay mensajes nuevos.")
          EOF

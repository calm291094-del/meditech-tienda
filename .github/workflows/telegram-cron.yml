name: ANIA OS Daily Telegram Report

on:
  schedule:
    # Esto se ejecuta a las 8:00 AM UTC (Ajusta según tu zona horaria. Si estás en Cuba (UTC-5), 8 AM local son 13:00 UTC)
    - cron: '0 13 * * *' 
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si quieres

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch News and Send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          # Instalamos herramientas para leer RSS
          sudo apt-get update && sudo apt-get install -y xmlstarlet curl
          
          # Función para enviar a Telegram
          send_msg() {
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=$1"
          }

          # Generamos un mensaje de ejemplo (puedes expandir esto con un script de Python/Node si quieres leer RSS aquí)
          MSG="🌟 *INFORME AUTOMÁTICO ANIA OS*\n\n🇨🇺 *Noticias de Cuba*\n1. [Cubadebate](http://cubadebate.cu)\n2. [Granma](https://granma.cu)\n\n🧠 *Tendencias IA*\n1. [OpenAI Blog](https://openai.com/blog)\n\n_Generado automáticamente por GitHub Actions_"
          
          send_msg "$MSG"
          echo "Mensaje enviado a Telegram exitosamente."

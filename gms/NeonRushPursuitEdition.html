<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==========================================
// NEON RUSH: PURSUIT EDITION
// Motor de Carreras Arcade / Cyberpunk
// ==========================================

let scene, camera, renderer, clock;
let players = [];
let trackCurve, trackMesh;
let traffic = [], pedestrians = [], police = [];
let ufo = null, ufoActive = false, ufoTimer = 20;
let gameMode = 1, totalLaps = 3, trafficDensity = 1;
let gameState = 'MENU'; // MENU, COUNTDOWN, PLAY, EVENT
let eventText = '';

// Controles
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// ==========================================
// INICIALIZACIÓN THREE.JS
// ==========================================
function initThree() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05050A);
    scene.fog = new THREE.FogExp2(0x05050A, 0.008);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Luces
    const ambient = new THREE.AmbientLight(0x222244, 0.5);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    clock = new THREE.Clock();
    window.addEventListener('resize', onResize);
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// ==========================================
// GENERACIÓN DE PISTA (PROCEDURAL)
// ==========================================
function generateTrack(type) {
    const pts = [];
    const segments = 100;
    const radius = 200;
    
    for(let i=0; i<segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        let r = radius;
        if(type == 1) r += Math.sin(angle * 4) * 60; // Dunes
        if(type == 2) r += Math.cos(angle * 3) * 80 + Math.sin(angle * 7) * 20; // Mountain
        else r += Math.sin(angle * 2) * 40; // City
        
        pts.push(new THREE.Vector3(Math.cos(angle)*r, 0, Math.sin(angle)*r));
    }
    
    trackCurve = new THREE.CatmullRomCurve3(pts, true);
    
    // Crear geometría de la pista
    const trackWidth = 24;
    const points = trackCurve.getPoints(200);
    const geometry = new THREE.BufferGeometry();
    const vertices = [], uvs = [], indices = [];
    
    for(let i=0; i<points.length; i++) {
        const p = points[i];
        const nextP = points[(i+1)%points.length];
        const dir = new THREE.Vector3().subVectors(nextP, p).normalize();
        const normal = new THREE.Vector3(-dir.z, 0, dir.x);
        
        const left = p.clone().add(normal.clone().multiplyScalar(trackWidth/2));
        const right = p.clone().add(normal.clone().multiplyScalar(-trackWidth/2));
        
        vertices.push(left.x, 0.1, left.z);
        vertices.push(right.x, 0.1, right.z);
        uvs.push(0, i/points.length*10);
        uvs.push(1, i/points.length*10);
        
        if(i < points.length - 1) {
            const idx = i * 2;
            indices.push(idx, idx+1, idx+2);
            indices.push(idx+1, idx+3, idx+2);
        }
    }
    
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({ 
        color: 0x11111a, 
        roughness: 0.4, 
        metalness: 0.6,
        emissive: 0x050510
    });
    trackMesh = new THREE.Mesh(geometry, mat);
    scene.add(trackMesh);

    // Bordes Neón
    addTrackBorders(points, trackWidth, 0xff0055);
    
    // Suelo infinito
    const groundGeo = new THREE.PlaneGeometry(2000, 2000);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x05050A, roughness: 1 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    scene.add(ground);

    // Decoración (Edificios Neón / Luces)
    addEnvironment(points);
}

function addTrackBorders(points, width, color) {
    const lineMat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
    const leftPts = [], rightPts = [];
    
    for(let i=0; i<points.length; i++) {
        const p = points[i];
        const nextP = points[(i+1)%points.length];
        const dir = new THREE.Vector3().subVectors(nextP, p).normalize();
        const normal = new THREE.Vector3(-dir.z, 0, dir.x);
        
        leftPts.push(p.clone().add(normal.clone().multiplyScalar(width/2)).setY(0.5));
        rightPts.push(p.clone().add(normal.clone().multiplyScalar(-width/2)).setY(0.5));
    }
    
    const leftGeo = new THREE.BufferGeometry().setFromPoints(leftPts);
    const rightGeo = new THREE.BufferGeometry().setFromPoints(rightPts);
    scene.add(new THREE.Line(leftGeo, lineMat));
    scene.add(new THREE.Line(rightGeo, lineMat));
}

function addEnvironment(points) {
    // Luces de neón aleatorias alrededor de la pista
    for(let i=0; i<100; i++) {
        const idx = Math.floor(Math.random() * points.length);
        const p = points[idx];
        const nextP = points[(idx+1)%points.length];
        const dir = new THREE.Vector3().subVectors(nextP, p).normalize();
        const normal = new THREE.Vector3(-dir.z, 0, dir.x);
        
        const side = Math.random() > 0.5 ? 1 : -1;
        const offset = 20 + Math.random() * 40;
        const pos = p.clone().add(normal.clone().multiplyScalar(side * offset));
        
        const color = Math.random() > 0.5 ? 0x00f3ff : 0xff0055;
        const light = new THREE.PointLight(color, 2, 30);
        light.position.set(pos.x, 5, pos.z);
        scene.add(light);
        
        // Poste
        const poleGeo = new THREE.CylinderGeometry(0.2, 0.2, 10);
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.set(pos.x, 5, pos.z);
        scene.add(pole);
    }
}

// ==========================================
// VEHÍCULOS Y FÍSICA ARCADE
// ==========================================
function createCar(color, isP2) {
    const group = new THREE.Group();
    
    // Chasis
    const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4.5);
    const bodyMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.8, roughness: 0.2, emissive: color, emissiveIntensity: 0.2 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.6;
    group.add(body);
    
    // Cabina
    const cabGeo = new THREE.BoxGeometry(1.6, 0.7, 2);
    const cabMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
    const cab = new THREE.Mesh(cabGeo, cabMat);
    cab.position.set(0, 1.1, -0.2);
    group.add(cab);

    // Luces traseras
    const tailGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
    const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const tailL = new THREE.Mesh(tailGeo, tailMat); tailL.position.set(-0.7, 0.6, 2.2);
    const tailR = new THREE.Mesh(tailGeo, tailMat); tailR.position.set(0.7, 0.6, 2.2);
    group.add(tailL, tailR);

    // Neón inferior (Underglow)
    const underLight = new THREE.PointLight(color, 1.5, 8);
    underLight.position.set(0, 0.2, 0);
    group.add(underLight);

    scene.add(group);

    return {
        mesh: group,
        pos: new THREE.Vector3(),
        angle: 0,
        speed: 0,
        steer: 0,
        nitro: 100,
        heat: 0, // Most Wanted element
        lap: 1,
        checkpoint: 0,
        finished: false,
        driftFactor: 0,
        isP2: isP2,
        color: color
    };
}

function updateCarPhysics(car, dt) {
    if(car.finished) {
        car.speed *= 0.95;
        return;
    }

    const isP1 = !car.isP2;
    const accelKey = isP1 ? 'KeyW' : 'ArrowUp';
    const brakeKey = isP1 ? 'KeyS' : 'ArrowDown';
    const leftKey = isP1 ? 'KeyA' : 'ArrowLeft';
    const rightKey = isP1 ? 'KeyD' : 'ArrowRight';
    const driftKey = isP1 ? 'Space' : 'Enter';
    const nitroKey = isP1 ? 'ShiftLeft' : 'ShiftRight';

    // Aceleración
    let accel = 0;
    if(keys[accelKey]) accel = 45;
    if(keys[brakeKey]) accel = -30;

    // Nitro (Hot Pursuit / NFS element)
    let maxSpeed = 80;
    if(keys[nitroKey] && car.nitro > 0) {
        accel += 30;
        maxSpeed = 120;
        car.nitro -= dt * 30;
    } else {
        car.nitro = Math.min(100, car.nitro + dt * 10);
    }

    // Dirección
    let steerInput = 0;
    if(keys[leftKey]) steerInput = 1;
    if(keys[rightKey]) steerInput = -1;

    // Drift (Derrape)
    let isDrifting = keys[driftKey] && Math.abs(car.speed) > 20;
    if(isDrifting) {
        car.driftFactor = Math.min(1, car.driftFactor + dt * 3);
        car.speed *= 0.99; // Fricción lateral
    } else {
        car.driftFactor = Math.max(0, car.driftFactor - dt * 2);
    }

    // Física
    car.speed += accel * dt;
    car.speed *= 0.98; // Fricción general
    car.speed = Math.max(-30, Math.min(maxSpeed, car.speed));

    // Giro (depende de la velocidad y el drift)
    let turnSpeed = 2.5 - (Math.abs(car.speed) / maxSpeed) * 1.2;
    if(isDrifting) turnSpeed *= 1.5;
    
    car.angle += steerInput * turnSpeed * dt * Math.sign(car.speed) * (1 + car.driftFactor);

    // Movimiento
    const moveAngle = car.angle - car.driftFactor * steerInput * 0.5; // Deslizamiento en drift
    car.pos.x += Math.sin(moveAngle) * car.speed * dt;
    car.pos.z += Math.cos(moveAngle) * car.speed * dt;

    // Colisión con bordes de pista (Simplificado: si se aleja mucho del centro de la curva)
    const closestPoint = trackCurve.getPointAt(getClosestT(car.pos));
    const distToCenter = car.pos.distanceTo(closestPoint);
    if(distToCenter > 14) {
        car.speed *= 0.9; // Penalización por salirse
        car.pos.lerp(closestPoint, 0.1); // Empujar hacia adentro
        if(distToCenter > 18) car.speed *= 0.5; // Choque fuerte
    }

    // Actualizar Mesh
    car.mesh.position.copy(car.pos);
    car.mesh.position.y = 0.4;
    car.mesh.rotation.y = car.angle;
    
    // Efecto visual de drift
    if(isDrifting) {
        car.mesh.rotation.z = steerInput * 0.15;
    } else {
        car.mesh.rotation.z *= 0.9;
    }
}

function getClosestT(pos) {
    let minDist = Infinity, bestT = 0;
    for(let t=0; t<=1; t+=0.01) {
        const p = trackCurve.getPointAt(t);
        const d = pos.distanceTo(p);
        if(d < minDist) { minDist = d; bestT = t; }
    }
    return bestT;
}

// ==========================================
// TRÁFICO, PEATONES Y EVENTOS
// ==========================================
function spawnTraffic() {
    if(trafficDensity == 0) return;
    const count = trafficDensity * 5;
    for(let i=0; i<count; i++) {
        const t = Math.random();
        const p = trackCurve.getPointAt(t);
        const tangent = trackCurve.getTangentAt(t);
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
        const offset = (Math.random() - 0.5) * 16;
        
        const geo = new THREE.BoxGeometry(2, 1.5, 4);
        const mat = new THREE.MeshStandardMaterial({ color: 0x555555, emissive: 0x222222 });
        const mesh = new THREE.Mesh(geo, mat);
        
        const pos = p.clone().add(normal.multiplyScalar(offset));
        mesh.position.copy(pos);
        mesh.position.y = 0.8;
        mesh.lookAt(p.clone().add(tangent));
        scene.add(mesh);
        
        traffic.push({ mesh, t: t, speed: 10 + Math.random() * 15, offset: offset });
    }
}

function spawnPedestrians() {
    for(let i=0; i<20; i++) {
        const t = Math.random();
        const p = trackCurve.getPointAt(t);
        const tangent = trackCurve.getTangentAt(t);
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
        const side = Math.random() > 0.5 ? 1 : -1;
        
        const geo = new THREE.CylinderGeometry(0.3, 0.3, 1.8);
        const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
        const mesh = new THREE.Mesh(geo, mat);
        
        const pos = p.clone().add(normal.multiplyScalar(side * (14 + Math.random() * 5)));
        mesh.position.copy(pos);
        mesh.position.y = 0.9;
        scene.add(mesh);
        pedestrians.push({ mesh, basePos: pos.clone(), t: t });
    }
}

function updateUFO(dt) {
    ufoTimer -= dt;
    if(!ufoActive && ufoTimer <= 0) {
        triggerUFOEvent();
    }
    
    if(ufoActive && ufo) {
        ufo.position.x += dt * 40;
        ufo.position.z += dt * 20;
        ufo.rotation.y += dt * 5;
        
        // Efecto en jugadores
        players.forEach(p => {
            if(p.mesh.position.distanceTo(ufo.position) < 30) {
                p.speed *= 0.95; // Gravedad alterada / Fricción
                p.angle += (Math.random() - 0.5) * 0.1; // Descontrol
            }
        });

        if(ufo.position.x > 300) {
            scene.remove(ufo);
            ufo = null;
            ufoActive = false;
            ufoTimer = 30 + Math.random() * 30;
            document.getElementById('event-alert').style.display = 'none';
        }
    }
}

function triggerUFOEvent() {
    ufoActive = true;
    const geo = new THREE.CylinderGeometry(0, 10, 3, 16);
    const mat = new THREE.MeshBasicMaterial({ color: 0xaa00ff, transparent: true, opacity: 0.8 });
    ufo = new THREE.Mesh(geo, mat);
    
    const light = new THREE.PointLight(0xaa00ff, 5, 50);
    ufo.add(light);
    
    const startP = trackCurve.getPointAt(0);
    ufo.position.set(startP.x - 100, 30, startP.z - 100);
    scene.add(ufo);
    
    document.getElementById('event-alert').innerText = "⚠️ OVNI DETECTADO - GRAVEDAD ALTERADA ⚠️";
    document.getElementById('event-alert').style.display = 'block';
    setTimeout(() => { document.getElementById('event-alert').style.display = 'none'; }, 3000);
}

// ==========================================
// POLICÍA (MOST WANTED ELEMENT)
// ==========================================
function updatePolice(dt) {
    players.forEach((p, idx) => {
        if(p.heat > 0 && !p.finished) {
            // Generar policía si no hay suficiente
            const myCops = police.filter(c => c.targetIdx === idx);
            if(myCops.length < p.heat && Math.random() < 0.01) {
                spawnCop(p, idx);
            }
            
            myCops.forEach(cop => {
                const dx = p.pos.x - cop.mesh.position.x;
                const dz = p.pos.z - cop.mesh.position.z;
                const dist = Math.hypot(dx, dz);
                const ang = Math.atan2(dx, dz);
                
                cop.mesh.rotation.y = ang;
                cop.mesh.position.x += Math.sin(ang) * 60 * dt;
                cop.mesh.position.z += Math.cos(ang) * 60 * dt;
                
                // Ramming (Ariete)
                if(dist < 3) {
                    p.speed *= 0.5;
                    p.heat = Math.max(0, p.heat - 0.01);
                }
            });
        }
    });
}

function spawnCop(targetPlayer, targetIdx) {
    const t = (getClosestT(targetPlayer.pos) + 0.2) % 1;
    const p = trackCurve.getPointAt(t);
    
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4.5), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    body.position.y = 0.8;
    group.add(body);
    
    const lights = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 0.5), new THREE.MeshBasicMaterial({ color: 0x0000ff }));
    lights.position.set(0, 1.4, 0);
    group.add(lights);
    
    const siren = new THREE.PointLight(0xff0000, 2, 15);
    siren.position.set(0, 2, 0);
    group.add(siren);
    
    group.position.copy(p);
    scene.add(group);
    police.push({ mesh: group, targetIdx: targetIdx });
}

// ==========================================
// LÓGICA DE JUEGO Y HUD
// ==========================================
function checkLaps(car) {
    const t = getClosestT(car.pos);
    const prevT = car.checkpoint;
    
    // Cruce de línea de meta (de 0.9 a 0.1)
    if(prevT > 0.8 && t < 0.2 && car.speed > 0) {
        car.lap++;
        if(car.lap > totalLaps) {
            car.finished = true;
            showFinish(car);
        }
    }
    car.checkpoint = t;
}

function showFinish(car) {
    const alert = document.getElementById('event-alert');
    alert.innerText = car.isP2 ? "🏆 JUGADOR 2 GANA 🏆" : "🏆 JUGADOR 1 GANA 🏆";
    alert.style.color = car.isP2 ? "#00f3ff" : "#ff0055";
    alert.style.display = 'block';
    setTimeout(() => {
        alert.style.display = 'none';
        gameState = 'MENU';
        document.getElementById('menu').style.display = 'flex';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('divider').style.display = 'none';
    }, 5000);
}

function updateHUD() {
    players.forEach((p, i) => {
        const spd = document.getElementById(`spd-p${i+1}`);
        const lap = document.getElementById(`lap-p${i+1}`);
        const nit = document.getElementById(`nit-p${i+1}`);
        const heat = document.getElementById(`heat-p${i+1}`);
        
        if(spd) spd.innerHTML = `${Math.abs(Math.round(p.speed * 3))} <span style="font-size:1rem">KM/H</span>`;
        if(lap) lap.innerText = `VUELTA ${Math.min(p.lap, totalLaps)}/${totalLaps}`;
        if(nit) nit.style.width = `${p.nitro}%`;
        if(heat) heat.innerText = `🔥 BÚSQUEDA: ${'★'.repeat(Math.floor(p.heat))}${'☆'.repeat(5-Math.floor(p.heat))}`;
    });
}

// ==========================================
// RENDERIZADO Y LOOP
// ==========================================
function render() {
    if(gameState !== 'PLAY' && gameState !== 'COUNTDOWN') return;

    const w = window.innerWidth;
    const h = window.innerHeight;

    if(gameMode === 1) {
        renderer.setViewport(0, 0, w, h);
        renderer.setScissor(0, 0, w, h);
        renderer.setScissorTest(false);
        renderer.render(scene, players[0].cam);
    } else {
        renderer.setScissorTest(true);
        // P1 Izquierda
        renderer.setViewport(0, 0, w/2, h);
        renderer.setScissor(0, 0, w/2, h);
        renderer.render(scene, players[0].cam);
        
        // P2 Derecha
        renderer.setViewport(w/2, 0, w/2, h);
        renderer.setScissor(w/2, 0, w/2, h);
        renderer.render(scene, players[1].cam);
    }
}

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    if(gameState === 'PLAY') {
        players.forEach(p => {
            updateCarPhysics(p, dt);
            checkLaps(p);
            
            // Cámara Follow
            const camOffset = new THREE.Vector3(0, 6, -12);
            camOffset.applyAxisAngle(new THREE.Vector3(0,1,0), p.angle);
            const targetPos = p.pos.clone().add(camOffset);
            p.cam.position.lerp(targetPos, 0.1);
            p.cam.lookAt(p.pos.x, 2, p.pos.z);
            
            // Generar Calor (Most Wanted) si chocan o van muy rápido en sentido contrario
            if(Math.abs(p.speed) > 60) p.heat = Math.min(5, p.heat + dt * 0.1);
        });

        updateUFO(dt);
        updatePolice(dt);
        updateHUD();
    }

    render();
}

// ==========================================
// INICIO DEL JUEGO
// ==========================================
function startGame(mode) {
    gameMode = mode;
    totalLaps = parseInt(document.getElementById('sel-laps').value);
    trafficDensity = parseInt(document.getElementById('sel-traffic').value);
    const trackType = parseInt(document.getElementById('sel-track').value);

    // Limpiar escena
    while(scene.children.length > 0) scene.remove(scene.children[0]);
    players = []; traffic = []; pedestrians = []; police = [];
    ufo = null; ufoActive = false; ufoTimer = 20;

    // Reconstruir entorno
    const ambient = new THREE.AmbientLight(0x222244, 0.5); scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5); dirLight.position.set(50, 100, 50); scene.add(dirLight);
    
    generateTrack(trackType);
    spawnTraffic();
    spawnPedestrians();

    // Crear Jugadores
    const startP = trackCurve.getPointAt(0);
    const startTan = trackCurve.getTangentAt(0);
    const startNorm = new THREE.Vector3(-startTan.z, 0, startTan.x);
    
    const p1 = createCar(0xff0055, false);
    p1.pos.copy(startP).add(startNorm.clone().multiplyScalar(4));
    p1.angle = Math.atan2(startTan.x, startTan.z);
    p1.cam = new THREE.PerspectiveCamera(75, (window.innerWidth/2)/window.innerHeight, 0.1, 1000);
    players.push(p1);

    if(mode === 2) {
        const p2 = createCar(0x00f3ff, true);
        p2.pos.copy(startP).add(startNorm.clone().multiplyScalar(-4));
        p2.angle = Math.atan2(startTan.x, startTan.z);
        p2.cam = new THREE.PerspectiveCamera(75, (window.innerWidth/2)/window.innerHeight, 0.1, 1000);
        players.push(p2);
        document.getElementById('hud-p2-container').style.display = 'block';
        document.getElementById('divider').style.display = 'block';
    } else {
        document.getElementById('hud-p2-container').style.display = 'none';
        document.getElementById('divider').style.display = 'none';
    }

    // UI
    document.getElementById('menu').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    
    // Countdown
    gameState = 'COUNTDOWN';
    let count = 3;
    const cdEl = document.getElementById('countdown');
    cdEl.style.display = 'block';
    cdEl.innerText = count;
    
    const cdInt = setInterval(() => {
        count--;
        if(count > 0) cdEl.innerText = count;
        else if(count === 0) { cdEl.innerText = "GO!"; cdEl.style.color = "#00ff00"; }
        else {
            clearInterval(cdInt);
            cdEl.style.display = 'none';
            cdEl.style.color = "#fff";
            gameState = 'PLAY';
        }
    }, 1000);
}

// INIT
initThree();
animate();

</script>
